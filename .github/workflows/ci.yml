name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI builds from scratch; incremental artifacts only cost cache space and time.
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: clippy, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Show toolchain
        run: |
          rustc --version
          cargo clippy --version
      # Cold wgpu builds take several minutes; cache dependencies between runs.
      - uses: Swatinem/rust-cache@v2
      # `--locked` fails if Cargo.lock is out of date: dependency versions stay pinned.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked
