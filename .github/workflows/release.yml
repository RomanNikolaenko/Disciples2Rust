name: Release

# Continuous delivery: every push to main builds playable packages for Windows and
# Linux, downloadable from the run's artifacts. Pushing a `v*` tag (e.g. `v0.1.0`) also
# publishes them as a GitHub Release, which the game's Update button installs from.
# Each package has a `.sha256` file beside it; the tag must match the version in
# Cargo.toml, since the game compares that version with the latest release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: disciples2_rust.exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: disciples2_rust
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # Release builds get their own cache, apart from CI's debug builds.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build release
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          # Tag builds are named after the tag, others after the commit.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA::7}"
          fi
          name="Disciples2Rust-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/release/${{ matrix.exe }}" "dist/$name/"
          # The game looks for `assets/` next to its executable.
          cp -r assets "dist/$name/"
          cd dist
          package="$name.${{ matrix.archive }}"
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip "$package" "$name" > /dev/null
          else
            tar -czf "$package" "$name"
          fi
          # The game checks a download against this before installing it.
          sha256sum "$package" > "$package.sha256"
          echo "PACKAGE=dist/$package" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.PACKAGE }}
            ${{ env.PACKAGE }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
